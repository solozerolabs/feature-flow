[project]
name = "feature-flow"
version = "0.1.0"
description = "Feature-flow plugin plus the SPEC-build-your-own reference-product pure functions."
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The reference-product modules mirror the spec's C/ path so their names match
# the backend exactly; add that dir to the path so tests import them by bare name.
pythonpath = ["backend/src/features/coding"]
